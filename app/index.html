<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doffy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><span class="mark">D</span><span>Doffy</span></div>
  <button class="new-btn" data-nav="nuova"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Nuova commessa</span></button>
  <nav class="tabs" aria-label="Sezioni">
    <button data-nav="progetti"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Progetti</button>
    <button data-nav="cal"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendario</button>
    <button data-nav="magazzino"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-5 9 5v11H3z"/><path d="M9 20v-6h6v6"/></svg>Magazzino</button>
    <button data-nav="location"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Location</button>
    <button data-nav="fornitori"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-6h6v6M3 12h18"/></svg>Fornitori</button>
    <button data-nav="todo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l2 2 4-4"/><rect x="3" y="4" width="18" height="16" rx="2"/></svg>To-Do</button>
  </nav>
  <div class="spacer"></div>
  <div class="who"><span class="av">M</span><span class="name">Master</span><span class="demo-tag">DEMO</span>
    <select id="user" hidden aria-hidden="true" tabindex="-1"></select>
  </div>
</aside>
<main id="main"></main>
</div>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>
<script src="js/data.js"></script>
<script src="js/data.local.js"></script>
<script src="js/app.js"></script>
</body>
</html>
